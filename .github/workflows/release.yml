name: Release

# Fires when a tag is pushed to the public repo. Runs goreleaser against
# .goreleaser.yml, builds cross-platform binaries, publishes a GitHub
# Release with the archives + checksums attached.
#
# Only effective in the public repo (github.com/bcdock/cli). In the
# upstream private monorepo this directory sits under
# services/bcdock-cli/.github/ which GitHub ignores - only repo-root
# .github/workflows/ is read. After the mirror filter promotes
# services/bcdock-cli/ to root, this workflow becomes active.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:        # manual trigger for dry runs from the Actions tab

permissions:
  contents: write           # required to create the GitHub Release

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # goreleaser needs full history for changelog

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Sanity check
        run: |
          go vet ./...
          go test ./...

      - name: Validate goreleaser config
        # `goreleaser check` (unlike `release`) treats DEPRECATED config as a
        # hard failure. goreleaser v2.16+ deprecated `brews:` (formula) in favour
        # of `homebrew_casks:` - but casks are macOS-only and would drop our
        # Linux `brew install` support, so we deliberately keep the formula.
        # `release --clean` below only warns on the deprecation and still
        # publishes, so this step stays as a soft signal, not a release gate.
        # A genuinely malformed config still fails at the `release` step.
        # Remove continue-on-error once we migrate off `brews:` before v3.
        continue-on-error: true
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          # GITHUB_TOKEN creates the GitHub Release in this repo.
          # HOMEBREW_TAP_TOKEN is a fine-grained PAT (Contents: Read+Write on
          # bcdock/homebrew-tap only) that lets goreleaser commit the formula.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  npm-publish:
    name: Publish to npm
    needs: goreleaser
    runs-on: ubuntu-latest
    # id-token:write enables npm trusted publishing (OIDC - no stored token needed).
    # Trust configured via: npm trust github @bcdock/cli --repo bcdock/cli --file release.yml
    permissions:
      contents: read
      pull-requests: read
      packages: read
      id-token: write
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No registry-url: it creates an .npmrc with _authToken=${NODE_AUTH_TOKEN}
          # which conflicts with OIDC trusted publishing.

      - name: Upgrade npm (trusted publishing requires >= 11.10.0)
        run: npm install -g npm@11.10.0

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Pack dry run
        run: npm pack --dry-run

      - name: Publish
        run: |
          TAG_NAME="$GITHUB_REF_NAME"
          if [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9] ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi

      # #636: the registry lists a new version minutes after `npm publish` succeeds (0.5.0: ~3 min),
      # so a fixed 30 s wait failed EVERY release with ETARGET and trained everyone to ignore the red.
      # Poll until the registry lists the version (bounded), then smoke once. Still red if the
      # version never appears or the installed binary reports a different version.
      - name: Post-publish smoke
        working-directory: /tmp        # break out of the package source dir
        env:
          SMOKE_WAIT_SECONDS: 600      # overridable only so the step's own test can run it fast
          SMOKE_POLL_SECONDS: 30
        run: |
          VER="${GITHUB_REF_NAME#v}"
          start=$SECONDS; checks=0
          until [ "$(npm view "@bcdock/cli@${VER}" version 2>/dev/null)" = "$VER" ]; do
            checks=$((checks + 1))
            if [ $((SECONDS - start)) -ge "$SMOKE_WAIT_SECONDS" ]; then
              echo "::error::@bcdock/cli@${VER} is not on the registry after $((SECONDS - start))s (${checks} checks) - the publish did not land"
              exit 1
            fi
            sleep "$SMOKE_POLL_SECONDS"
          done
          echo "Registry lists @bcdock/cli@${VER} after $((SECONDS - start))s (${checks} retries)."
          # npx's own packument can trail `npm view` by seconds; give it two short retries.
          for try in 1 2 3; do
            if out=$(npx -y "@bcdock/cli@${VER}" --version 2>&1); then break; fi
            [ "$try" = 3 ] && { echo "$out"; echo "::error::npx could not run @bcdock/cli@${VER}"; exit 1; }
            sleep 10
          done
          echo "$out"
          # Exact, not a substring: "bcdock version 0.5.01" must not pass for 0.5.0 (Ravi, #640).
          got=$(awk 'END { print $NF }' <<< "$out")
          [ "$got" = "$VER" ] || { echo "::error::the installed CLI reports version '$got', expected ${VER}"; exit 1; }
